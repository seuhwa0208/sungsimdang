spring:
  application:
    name: project
  datasource:
    url: jdbc:postgresql://localhost:5432/djtbc
    username: postgres
    password: 1004
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: 8088